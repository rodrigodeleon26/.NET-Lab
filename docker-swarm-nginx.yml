version: '3.8'

services:
  nginx:
    image: mangas330/nginx
    ports:
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - ./ssl/server.crt:/etc/nginx/certs/server.crt
      - ./ssl/server.key:/etc/nginx/certs/server.key
      - ./nginx.conf:/etc/nginx/nginx.conf
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks:
      - HCE_app-network

networks:
  HCE_app-network:
    external: true
