<h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Restablecer Contraseña</h2>
<p class="text-center text-gray-600 mb-6">
  Por favor, ingresa tu nueva contraseña.
</p>
<form [formGroup]="resetPasswordForm" (ngSubmit)="onResetPasswordSubmit()" class="space-y-6">
  <div>
    <label for="newPassword" class="block text-gray-700 font-bold mb-2">Nueva Contraseña</label>
    <input id="newPassword" formControlName="newPassword" type="password" placeholder="Nueva contraseña"
      class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
    <div *ngIf="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched" class="text-red-500 text-sm mt-2">
      <small *ngIf="resetPasswordForm.get('newPassword')?.errors?.['required']">La contraseña es requerida.</small>
      <small *ngIf="resetPasswordForm.get('newPassword')?.errors?.['minlength']">La contraseña debe tener al menos 8 caracteres.</small>
    </div>
  </div>
  <div>
    <label for="confirmPassword" class="block text-gray-700 font-bold mb-2">Confirmar Contraseña</label>
    <input id="confirmPassword" formControlName="confirmPassword" type="password" placeholder="Confirmar contraseña"
      class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
    <div *ngIf="resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched" class="text-red-500 text-sm mt-2">
      <small *ngIf="resetPasswordForm.get('confirmPassword')?.errors?.['required']">La confirmación de la contraseña es requerida.</small>
      <small *ngIf="resetPasswordForm.get('confirmPassword')?.errors?.['passwordMismatch']">Las contraseñas no coinciden.</small>
    </div>
  </div>
  <div>
    <button type="submit"
      class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
      [disabled]="resetPasswordForm.invalid">Restablecer Contraseña</button>
  </div>
</form>
