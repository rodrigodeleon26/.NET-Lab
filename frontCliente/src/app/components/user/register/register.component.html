<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Registrarse</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
    <div>
      <label for="fullName" class="block text-gray-700 font-bold mb-2">Nombre Completo</label>
      <input type="text" id="fullName" formControlName="fullName" placeholder="Nombre completo" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <div *ngIf="form.get('fullName')?.invalid && form.get('fullName')?.touched" class="text-red-500 text-sm mt-2">
        <div *ngIf="form.get('fullName')?.errors?.['required']">El nombre completo es requerido.</div>
      </div>
    </div>
    <div>
      <label for="email" class="block text-gray-700 font-bold mb-2">Correo Electrónico</label>
      <input type="email" id="email" formControlName="email" placeholder="Correo electrónico" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-red-500 text-sm mt-2">
        <div *ngIf="form.get('email')?.errors?.['required']">El correo electrónico es requerido.</div>
        <div *ngIf="form.get('email')?.errors?.['email']">El correo electrónico debe ser válido.</div>
      </div>
    </div>
    <div>
      <label for="password" class="block text-gray-700 font-bold mb-2">Contraseña</label>
      <input type="password" id="password" formControlName="password" placeholder="Contraseña" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="text-red-500 text-sm mt-2">
        <div *ngIf="form.get('password')?.errors?.['required']">La contraseña es requerida.</div>
        <div *ngIf="form.get('password')?.errors?.['minlength']">La contraseña debe tener al menos 8 caracteres.</div>
      </div>
    </div>
    <div>
      <label for="confirmPassword" class="block text-gray-700 font-bold mb-2">Confirmar Contraseña</label>
      <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="Confirmar contraseña" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <div *ngIf="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched" class="text-red-500 text-sm mt-2">
        <div *ngIf="form.get('confirmPassword')?.errors?.['required']">Confirmar la contraseña es requerido.</div>
        <div *ngIf="form.get('confirmPassword')?.errors?.['passwordMismatch']">Las contraseñas no coinciden.</div>
      </div>
    </div>
    <div>
      <button type="submit" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">Registrarse</button>
    </div>
  </form>
</div>
