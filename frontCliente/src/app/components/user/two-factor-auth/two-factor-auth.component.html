<h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Autenticación de dos pasos</h2>
<p class="text-center text-gray-600 mb-6">
  Ingrese el código generado en la aplicación de Google Authenticator.
</p>
<div class="text-center mb-6">
  <input type="text" [(ngModel)]="authCode" placeholder="Ingrese el código de autenticación"
    class="w-full border border-gray-300 rounded-lg py-2 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500" />
</div>
<div class="text-center mb-4">
  <button (click)="verifyAuthCode()"
    class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
    [disabled]="isLoading">
    <ng-container *ngIf="!isLoading">Verificar Código</ng-container>
    <ng-container *ngIf="isLoading">
      <svg class="animate-spin h-5 w-5 text-white inline-block mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      Verificando...
    </ng-container>
  </button>
</div>
