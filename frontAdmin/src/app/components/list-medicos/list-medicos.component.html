<div class="container mx-auto px-4 mt-4 md:mt-8 md:p-0">
    <div *ngIf="loading" class="fixed inset-0 flex items-center justify-center bg-gray-800 bg-opacity-75 z-50">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
        <p class="text-white text-lg">Cargando...</p>
    </div>
    <div class="flex justify-center">
        
        <div class="w-full max-w-6xl bg-gray-claro rounded-lg shadow-xl overflow-hidden relative">
            <div *ngIf="successMessage" class="w-full bg-green-intermedio text-center text-white text-lg max-h-10">
                {{ successMessage }}
            </div>
            <div *ngIf="errorMessage" class="w-full bg-red-500 text-center text-white text-lg max-h-10">
                {{ errorMessage }}
            </div> 
            <div class="flex justify-between">

                <div class="flex justify-start space-x-5 p-5 w-full">
                    <div class="flex bg-zinc-300 p-2 rounded space-x-1 w-fit">
                        <input [(ngModel)]="busqueda" type="text" id="nombres" class="border rounded-md pl-1" placeholder="Buscar...">
                        <button class="bg-gray-claro hover:bg-gray-intermedio rounded-full size-8 flex justify-center items-center" (click)="buscar()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                    </div>
                </div>

                <h1 class="text-center text-xl mt-5 w-full">Medicos</h1>

                <div class="flex justify-end space-x-5 p-5 w-full">
                    <button (click)="agregarMedico()" title="agregar" class="bg-blue-intermedio text-white border border-blue-intermedio rounded-md py-1 px-3 hover:bg-blue-oscuro transition duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    </button>
                </div>
            </div>
            
            <div class="flex flex-col md:flex-row p-5">
                <div class="border-gray-intermedio bg-gray-claro rounded w-full shadow-md">
                    <div *ngFor="let medico of medicos" class="m-2 p-2 border-gray-oscuro border flex-col rounded">

                        <div class="flex justify-between">
                            <div class="flex w-full md:w-3/4 justify-between flex-wrap">
                                <p>
                                    <span class="font-semibold text-lg">
                                        Nombre: 
                                    </span> 
                                    {{ medico.nombres }} {{ ' ' }} {{ medico.apellidos }}
                                </p>
                                <p>
                                    <span class="font-semibold text-lg">
                                        {{"CI: "}}
                                    </span> 
                                    {{ medico.documento }}
                                </p>
                                <p>
                                    <span class="font-semibold text-lg">
                                        {{"Tel: "}}
                                    </span> 
                                    {{ medico.telefono }}
                                </p>
                                <p>
                                    <span class="font-semibold text-lg">
                                        {{"Correo: "}}
                                    </span> 
                                    {{ medico.email }}
                                </p>
                            </div>
                            <div class="max-w-fit flex flex-col justify-center md:flex-row md:justify-end">
                                <button (click)="verDetallePara == medico.id ? verDetallePara = null : verDetallePara = medico.id">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                </button>
                                <button (click)="editarMedico(medico.id)">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.66V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5.34"></path><polygon points="18 2 22 6 12 16 8 16 8 12 18 2"></polygon></svg>
                                </button>
                                <button (click)="this.medicoBorrarId = medico.id; this.isModalVisible = true">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                </button>
                            </div>
                        </div>
                        <!-- Mostrar solo los que tengan ver detalle para == medico.id -->
                        <div *ngIf="verDetallePara === medico.id" class="flex border-t border-gray-oscuro flex-wrap mt-2 w-full justify-around">
                            <div *ngFor="let especialidad of medico.especialidades" class="w-fit">
                                <p>
                                    {{ especialidad.nombre }}
                                </p>
                            </div>
                        </div>
                        
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- MODAL BORRAR IMAGEN-->
<div *ngIf="isModalVisible" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50" (click)="onModalContainerClick($event)">
	<div class="bg-white p-6 rounded-lg shadow-lg max-w-lg w-full" (click)="$event.stopPropagation()">
        <p class="my-2">¿SEGURO QUE QUIERES BORRAR ESTE MEDICO?</p>
		<div class="flex justify-end space-x-4">
			<button class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-md" (click)="borrarMedico()">Borrar</button>
			<button class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-md" (click)="this.isModalVisible=false">Cerrar</button>
		</div>
	</div>
</div>
