<div class="container mx-auto px-4 mt-4 md:mt-8 md:p-0">
    <div *ngIf="loading" class="fixed inset-0 flex items-center justify-center bg-gray-800 bg-opacity-75 z-50">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
        <p class="text-white text-lg">Cargando...</p>
    </div>
    <div class="flex justify-center">
        <div class="w-full max-w-6xl bg-gray-claro rounded-lg shadow-xl overflow-visible p-2 space-y-1">

            <h1 class="text-center">
                Articulos
            </h1>
            <div class="flex bg-zinc-300 p-2 rounded space-x-1 justify-between">
                <input [(ngModel)]="busqueda" type="text" id="buscar" class="border rounded-md max-w-48" placeholder="Buscar...">
                <button class="bg-blue-intermedio w-fit rounded hover:bg-blue-oscuro hover:shadow-lg transition duration-300" (click)="showModal()">
                    <img src="images/settings.svg" alt="Opciones Articulos" class="w-full">
                </button>
            </div>
            <div class="h-80 overflow-scroll" style="scrollbar-width: thin;"> 
                <button *ngFor="let articulo of articulos" class="w-full flex flex-col flex-nowrap text-nowrap border border-blue-100 bg-sky-100 hover:border-blue-300 hover:bg-blue-200 shadow-sm hover:shadow-lg text-base text-left p-1 rounded-md transition duration-75">
                    {{articulo.nombre}}
                </button>
            </div>

        </div>
    </div>
</div>

<!-- MODAL OPCIONES-->
<div *ngIf="isModalVisible" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50" (click)="hideModal()">
	<div class="bg-white p-6 rounded-lg shadow-lg max-w-xl w-full" (click)="$event.stopPropagation()">
        <p class="my-2">Especialidades - Opciones</p>
        <div class="flex">
            <div class="">
                <div class="flex bg-zinc-300 p-2 rounded space-x-1 justify-between order-2 md:order-1">
                    <input [(ngModel)]="busquedaModal" type="text" id="buscarModal" class="border rounded-md w-full" placeholder="Buscar...">
                </div>
        
                <div class="h-80 overflow-scroll">
                    <button *ngFor="let articulo of articulosModal" (click)="elegirParaEditar(articulo.id)" [ngClass]="{'bg-blue-oscuro text-white hover:border-blue-intermedio hover:bg-blue-600': editando?.id === articulo.id, 'bg-sky-100 hover:border-blue-300 hover:bg-sky-200': editando?.id !== articulo.id }" class="w-full flex flex-col flex-nowrap text-nowrap border border-blue-100 shadow-sm hover:shadow-lg text-base text-left p-1 rounded-md transition duration-100">
                        {{articulo.nombre}}
                    </button>
                </div>
            </div>

            <span class="border-x border-blue-intermedio my-3 mx-5 order-1 md:order-2 hidden md:block"></span>
            <span class="border-y border-blue-intermedio my-5 mx-3 order-1 block md:hidden"></span>

            <form [formGroup]="DatosArticuloForm" (ngSubmit)="agregarArticulo()" class="flex flex-col md:order-3 justify-between mb-4">

                <div>
                    <div class="flex flex-col">
                        <label for="nombre" class="text-sm font-medium">Nombre</label>
                        <input type="text" id="nombre" formControlName="nombre" class="border rounded-md p-2" placeholder="Ingrese El Nombre..." required>
                    </div>
                </div>
                <div class="flex justify-between">                    
                    <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-2 rounded-md">Nuevo</button>
                    <button type="button" (click)="editar()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-2 rounded-md">Editar</button>
                    <button type="button" (click)="Delete()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-2 rounded-md">Borrar</button>
                </div>

            </form>

        </div>
		<div class="flex justify-end space-x-4">
			<button class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-md" (click)="hideModal()">Cerrar</button>
		</div>
	</div>
</div>
