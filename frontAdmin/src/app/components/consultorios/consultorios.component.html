<div class="container mx-auto px-4 mt-4 md:mt-8 md:p-0">
    <div *ngIf="loading" class="fixed inset-0 flex items-center justify-center bg-gray-800 bg-opacity-75 z-50">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
        <p class="text-white text-lg">Cargando...</p>
    </div>
    <div class="flex justify-center">
        <div class="w-full max-w-6xl bg-gray-claro rounded-lg shadow-xl overflow-hidden">
            <div *ngIf="successMessage" class="w-full bg-green-intermedio text-center text-white text-lg max-h-10">
                {{ successMessage }}
            </div>
            <div *ngIf="errorMessage" class="w-full bg-red-500 text-center text-white text-lg max-h-10">
                {{ errorMessage }}
            </div> 
            
            <div class="flex flex-col md:flex-row p-5">
                <div class="w-full md:w-1/2 flex flex-col space-y-5 order-2 md:order-1"> <!-- Fondo de color agregado -->
                    <h1 class="flex justify-center text-lg">
                        Consultorios
                    </h1>
                    <table class="table-auto w-full border-collapse border border-gray-oscuro">
                        <thead>
                            <tr>
                                <th class="border border-gray-oscuro p-2">
                                    <div class="flex justify-center">
                                        <button (click)="sort('Num')">
                                            Numero
                                        </button>
                                        <div>
                                            <svg *ngIf="this.sortNum === 1"  xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                            <svg *ngIf="this.sortNum === -1" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
                                        </div>
                                    </div>
                                </th>
                                <th class="border border-gray-oscuro p-2">
                                    <div class="flex justify-center">
                                        <button (click)="sort('Piso')">
                                            Piso
                                        </button>
                                        <div>
                                            <svg *ngIf="this.sortPiso === 1"  xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                            <svg *ngIf="this.sortPiso === -1" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
                                        </div>
                                    </div>
                                </th>
                                <th class="border border-gray-oscuro p-2">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let cons of consultorios" class="border border-gray-oscuro">
                                <td class="border border-gray-oscuro p-2">
                                    {{ cons.numero }}
                                </td>
                                <td class="border border-gray-oscuro p-2">
                                    {{ cons.piso }}
                                </td>
                                <td class="border border-gray-oscuro p-2 flex justify-around">
                                    <button (click)="editarConsultorio(cons.id)" class="hover:bg-zinc-300 rounded-md flex justify-center items-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.66V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5.34"></path><polygon points="18 2 22 6 12 16 8 16 8 12 18 2"></polygon></svg>
                                    </button>
                                    <button (click)="this.consultorioBorrarId = cons.id; this.isModalVisible = true" class="hover:bg-zinc-300 rounded-md flex justify-center items-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <span class="border-x border-blue-intermedio my-3 mx-5 order-1 md:order-2 hidden md:block"></span>
                <span class="border-y border-blue-intermedio my-5 mx-3 order-1 block md:hidden"></span>
                <div class="w-full md:w-1/2 flex flex-col space-y-5 md:order-3">
                    <h1 class="flex justify-center text-lg">
                        Nuevo Consultorio
                    </h1>
                    <div *ngIf="this.editando" class="flex justify-center">
                        <button class="bg-red-400 p-2 rounded-full flex items-center hover:bg-red-500 hover:shadow-lg space-x-2" (click)="editando = null; this.DatosConsultorioForm.reset();">
                            <p class="text-white">
                                *Editando un Consultorio*
                            </p>
                            <span class="bg-red-600 rounded-full">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </span>
                        </button>
                    </div>
                    <div class="flex flex-col justify-start space-y-5 order-2 md:order-1" >
                        <form [formGroup]="DatosConsultorioForm" (ngSubmit)="agregarConsultorio()">
                            <div class="flex flex-col">
                                <label for="numero" class="text-sm font-medium">Numero</label>
                                <input 
                                required
                                type="text" 
                                id="numero" 
                                formControlName="numero" 
                                class="border rounded-md p-2" 
                                placeholder="Ingrese El Numero Aquí..."
                                pattern="^[0-9]\d*$"
                                inputmode="numeric"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                                />
                            </div>
                            <div class="flex flex-col">
                                <label for="piso" class="text-sm font-medium">Piso</label>
                                <input 
                                required
                                type="text" 
                                id="piso" 
                                formControlName="piso" 
                                class="border rounded-md p-2" 
                                placeholder="Ingrese El Piso Aquí..."
                                pattern="^[0-9]\d*$"
                                inputmode="numeric"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                                />
                            </div>
                            <div class="flex justify-center space-x-5 p-5">
                                <button type="submit" title="Guardar" class="bg-blue-intermedio text-white border border-blue-intermedio rounded-md py-1 px-3 hover:bg-blue-oscuro transition duration-300">
                                    Guardar
                                </button>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL BORRAR IMAGEN-->
<div *ngIf="isModalVisible" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50" (click)="onModalContainerClick($event)">
	<div class="bg-white p-6 rounded-lg shadow-lg max-w-lg w-full" (click)="$event.stopPropagation()">
        <p class="my-2">¿SEGURO QUE QUIERES BORRAR ESTE CONSULTORIO?</p>
		<div class="flex justify-end space-x-4">
			<button class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-md" (click)="borrarConsultorios()">Borrar</button>
			<button class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-md" (click)="this.isModalVisible=false">Cerrar</button>
		</div>
	</div>
</div>
