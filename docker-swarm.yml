version: '3.8'

services:
  pacientewebapi:
    image: ${DOCKER_REGISTRY-}pacientewebapi
    ports:
      - 5000:8080
      - 5001:8081
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks:
      - app-network

  citasmedicaswebapi:
    image: ${DOCKER_REGISTRY-}citasmedicaswebapi
    ports:
      - 5002:8080
      - 5003:8081
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks:
      - app-network

  historiaclinicawebapi:
    image: ${DOCKER_REGISTRY-}historiaclinicawebapi
    ports:
      - 5004:8080
      - 5005:8081
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks:
      - app-network

  authwebapi:
    image: ${DOCKER_REGISTRY-}authwebapi
    ports:
      - 5006:8080
      - 5007:8081
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks:
      - app-network

  administrativowebapi:
    image: ${DOCKER_REGISTRY-}administrativowebapi
    ports:
      - 5008:8080
      - 5009:8081
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks:
      - app-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    ports:
      - "1433:1433"
    environment:
      - SA_PASSWORD=Abc*123!
      - ACCEPT_EULA=Y
    volumes:
      - sqlserver-data:/var/opt/mssql
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    networks:
      - app-network

  frontenda:
    image: ${DOCKER_REGISTRY-}frontenda
    ports:
      - "5010:446"
    volumes:
      - ./frontAdmin/ssl/server.crt:/etc/nginx/certs/server.crt
      - ./frontAdmin/ssl/server.key:/etc/nginx/certs/server.key
      - ./frontAdmin/ssl/nginx-default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - pacientewebapi
      - citasmedicaswebapi
      - historiaclinicawebapi
      - administrativowebapi
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks:
      - app-network

  frontendm:
    image: ${DOCKER_REGISTRY-}frontendm
    ports:
      - "5011:444"
    volumes:
      - ./frontMedico/ssl/server.crt:/etc/nginx/certs/server.crt
      - ./frontMedico/ssl/server.key:/etc/nginx/certs/server.key
      - ./frontMedico/ssl/nginx-default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - pacientewebapi
      - citasmedicaswebapi
      - historiaclinicawebapi
      - administrativowebapi
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks:
      - app-network

  frontendc:
    image: ${DOCKER_REGISTRY-}frontendc
    ports:
      - "5012:445"
    volumes:
      - ./frontCliente/ssl/server.crt:/etc/nginx/certs/server.crt
      - ./frontCliente/ssl/server.key:/etc/nginx/certs/server.key
      - ./frontCliente/ssl/nginx-default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - pacientewebapi
      - citasmedicaswebapi
      - historiaclinicawebapi
      - administrativowebapi
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks:
      - app-network

networks:
  app-network:
    driver: overlay

volumes:
  sqlserver-data:
