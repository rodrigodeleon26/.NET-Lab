version: '3.8'

services:
  pacientewebapi:
    image: mangas330/pacientewebapi
    ports:
    - target: 8080
      published: 4999
      protocol: tcp
      mode: ingress
    - target: 8081
      published: 5001
      protocol: tcp
      mode: ingress
    volumes:
      - ./ssl/server.crt:/etc/nginx/certs/server.crt
      - ./ssl/server.key:/etc/nginx/certs/server.key
      - ./nginx.conf:/etc/nginx/nginx.conf
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks:
      - HCE_app-network

  citasmedicaswebapi:
    image: mangas330/citasmedicaswebapi
    ports:
