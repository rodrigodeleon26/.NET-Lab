version: '3.8'

services:
  pacientewebapi:
    image: mangas330/pacientewebapi
    ports:
    - target: 8080
      published: 4999
      protocol: tcp
      mode: ingress
    - target: 8081
      published: 5001
      protocol: tcp
      mode: ingress
    environment:
      - aspnetcore_environment=development
      - AES_KEY=1234567890123456
      - AES_IV=1234567890123456
      - S3_KEY=AKIAT4GVRXPXDNJ4G4HQ
      - S3_SECRET=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
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks:
      - HCE_app-network

